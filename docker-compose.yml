services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sedna
      POSTGRES_USER: sedna
      POSTGRES_PASSWORD: sedna
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sedna"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8011:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://sedna:sedna@db:5432/sedna
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5175:5173"
    depends_on:
      - backend

volumes:
  pgdata:
